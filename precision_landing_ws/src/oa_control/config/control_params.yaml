path_follower_node:
  ros__parameters:
    # Matches oa_planning's default goal z (planner_params.yaml) so the
    # vehicle levels off within the planned grid's height range immediately.
    takeoff_altitude_m: 1.5

    # Slower than a first-pass tuning would pick, deliberately: the planner
    # replans on a ~1s cadence (a full room-length A* search takes ~0.6s), so
    # at 0.8 m/s the vehicle could cover up to ~0.8m of a since-stale path
    # before the next update — more than the ~0.3-0.5m gaps this can leave
    # near inflated obstacles. 0.4 m/s keeps that worst-case distance small
    # relative to the map's own resolution and margin.
    cruise_speed_ms: 0.4

    # Must be smaller than the smallest gap between consecutive A* waypoints
    # (26-connected moves at 0.2m resolution: 0.2m axis-aligned, up to 0.346m
    # diagonal). 0.3 was letting the follower treat 2+ upcoming waypoints as
    # "already reached" in a single tick and jump straight to a farther one —
    # a straight line between two non-adjacent waypoints can cut a corner
    # near a tight squeeze even though each waypoint individually clears the
    # inflated obstacles (this produced a real 0.037m near-miss in testing).
    # 0.15 guarantees only one waypoint is ever skipped at a time.
    waypoint_reached_radius_m: 0.15
    goal_reached_radius_m: 0.3

    mavsdk_address: 'udpin://0.0.0.0:14540'
    timer_hz: 20.0

    # ── residual RL correction (safe opt-in) ───────────────────────────────
    # False preserves the verified classical follower byte-for-byte at the
    # command-selection point. Enable only for paired transfer trials.
    residual_enabled: false
    # Empty loads the model installed under share/oa_control/models.
    residual_policy_path: ''
    # Isaac training used a 1.0m/s classical proposal, a 0.75m/s per-axis
    # residual, and a 1.5m/s combined planar cap. Deployment scales all
    # velocity quantities by cruise_speed_ms / 1.0, retaining relative
    # residual authority while respecting this follower's conservative speed.
    residual_training_classical_speed_ms: 1.0
    residual_training_scale_ms: 0.75
    residual_training_speed_cap_ms: 1.5
    # The Isaac action scale is too aggressive for PX4/Gazebo tracking
    # dynamics; deploy with half authority while retaining the trained shape.
    residual_deployment_authority: 0.5
    # Pose-difference velocity is filtered before entering the policy.
    residual_velocity_filter_alpha: 0.35
    residual_status_log_period_s: 10.0
    # Prevent the learned correction from carrying the vehicle inside the
    # planner's inflated obstacle region. The classical proposal remains
    # admissible so the shield can only reduce residual authority.
    residual_planner_clearance_m: 0.65
    residual_clearance_lookahead_s: 1.0
    # Ramp from zero residual at the guard boundary to full authority this
    # far outside it, allowing room for PX4/Gazebo tracking lag.
    residual_clearance_release_margin_m: 0.35
    # Terminal navigation and marker acquisition use the proven classical
    # follower; the residual is fully disabled inside this goal distance.
    residual_goal_handoff_radius_m: 1.5
    # Save anchors only this far outside obstacles. If a residual correction
    # causes an empty replan, return to the last anchor instead of holding in
    # an occupied start cell forever.
    residual_recovery_clearance_m: 1.0

    # ── paired Gazebo transfer metrics (safe opt-in) ───────────────────────
    # When enabled, collision/timeout ends navigation with a zero command and
    # writes one JSON result. Disabled during ordinary flight/landing runs.
    trial_metrics_enabled: false
    trial_label: ''
    trial_output_path: ''
    trial_timeout_s: 90.0
    # Same analytic vehicle radius used by the Isaac evaluation.
    trial_collision_radius_m: 0.35

    # ── post-obstacle-course landing phase (see MILESTONE2_STATUS.md) ──────
    # Once the A* goal is reached, hand off from waypoint-following to
    # ArUco-marker landing — reusing pl_control/landing_controller_node's
    # align/descend approach (same gains work here: same PX4 x500 airframe,
    # same MavsdkBridge, same marker size), just embedded in this node's
    # state machine instead of a second MAVSDK-connected node, since two
    # nodes can't safely share one offboard control loop.
    marker_pi_kp: 0.5
    marker_pi_ki: 0.05
    marker_pi_integral_max: 0.5
    marker_horizontal_vel_max: 1.0
    marker_descend_vel_ms: 0.3
    marker_hacc_radius_m: 0.20
    marker_n_frames_aligned: 10
    marker_final_land_alt_m: 0.5
    # The goal (8.5, 0) is set to exactly the marker's (x, y), so the marker
    # should already be ~underfoot on arrival — this search only covers the
    # residual error from goal_reached_radius_m/waypoint tracking, not a
    # real hunt. Small and slow relative to pl_control's Milestone-1 search
    # (which has to cover open ground with no prior position estimate).
    marker_search_speed_ms: 0.2
    marker_search_step_m: 0.5
    marker_search_timeout_s: 20.0
    marker_lost_timeout_s: 2.0
